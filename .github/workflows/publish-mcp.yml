name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Authenticate to MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: mcp-publisher login http --domain beamtrace.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        run: node scripts/publish.mjs --target all --version "$GITHUB_REF_NAME" --yes

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cursor-plugin/plugin.json server.json
          if git diff --cached --quiet; then
            echo "Version files already match ${GITHUB_REF_NAME}"
            exit 0
          fi
          git commit -m "chore: set version to ${GITHUB_REF_NAME#v}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
